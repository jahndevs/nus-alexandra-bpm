; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

extra_scripts = pre:load_env.py

[env:data_collect]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../ml/data_collection/data_collect.cpp>

[env:xiao]
platform = nordicnrf52
platform_packages =
    framework-arduinoadafruitnrf52 @ https://github.com/Seeed-Studio/Adafruit_nRF52_Arduino.git
board = adafruit_feather_nrf52840
framework = arduino
board_build.variant = Seeed_XIAO_nRF52840
build_flags = -DUSE_TINYUSB
lib_deps = adafruit/Adafruit TinyUSB Library
monitor_speed = 115200
build_src_filter = -<*> +<xiao_test.cpp>
